name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$tag\"" Cargo.toml
          grep -q "\"version\": \"$tag\"" .claude-plugin/plugin.json
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Test
        if: "!contains(matrix.target, 'x86_64-apple')"
        run: cargo test --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name="piip-${GITHUB_REF_NAME}-${{ matrix.target }}"
          exe=""
          [[ "${{ matrix.target }}" == *windows* ]] && exe=".exe"
          mkdir -p dist pkg
          cp "target/${{ matrix.target }}/release/piip$exe" pkg/
          cp LICENSE README.md pkg/
          tar -czf "dist/$name.tar.gz" -C pkg .
          cd dist
          if command -v sha256sum >/dev/null; then sum=sha256sum; else sum="shasum -a 256"; fi
          $sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
