[package]
name = "piip"
version = "0.1.1"
edition = "2024"
description = "Fast local PII and secret masking CLI and Claude Code skill, with Presidio as an optional backend"
license = "MIT"
repository = "https://github.com/benridane/piip-skills"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
globset = "0.4"
ignore = "0.4.33"
pcre2-sys = "0.2.10"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.8"
ureq = { version = "2", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
